name: publish-pypi

# 发布到 PyPI。两种方式 (任选其一):
#  A. Trusted Publishing (OIDC, 推荐): 在 PyPI 项目页配置一次后自动发布, 无需 token
#     PyPI → <project> → Publishing → Add pending publisher:
#     GitHub owner: bobliang1979, Repository: code-guard, Workflow: publish-pypi.yml
#  B. API token: 在仓库 Settings → Secrets 添加 PYPI_TOKEN
#     (https://pypi.org/manage/account/token/, scope 选 "Upload packages")
# 触发: push v* tag (如 v0.2.0)
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC) 必需
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Test wheel in clean venv
        run: |
          python -m venv /tmp/wt
          /tmp/wt/bin/pip install dist/*.whl
          /tmp/wt/bin/code-guard demo | tail -1
      - name: Publish to PyPI (Trusted Publishing / token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 方式 A (OIDC): 无需传 token, 自动用 id-token 身份
          # 方式 B: 配置了 PYPI_TOKEN secret 时自动用它
          password: ${{ secrets.PYPI_TOKEN }}
