name: action-self-test

on:
  push:
    branches: [main]

jobs:
  guard-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 本地路径引用 action (测的就是当前 commit 的 action.yml)
      - uses: ./
        with:
          base: HEAD~1
          require-tests: 'false'

  guard-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 临时分支制造坏代码, 不污染 main
      - name: Create evil branch
        run: |
          git config user.email ci@ci && git config user.name ci
          git checkout -b evil-test
          printf 'import os\ndef p(u):\n    os.system("rm -rf " + u)\n    return eval(u)\n' > evil.py
          git add evil.py && git commit -qm "evil"
      - uses: ./
        continue-on-error: true
        with:
          base: origin/main
      # 注意: 不读 steps.*.outcome (composite action+continue-on-error 下不可靠)
      # 只做手动复跑: rc=1 且 verdict=BLOCK 才算真拦截
      - name: Verify BLOCK
        run: |
          code-guard check --dir . --base origin/main > /tmp/cg.log 2>&1
          rc=$?
          if [ $rc -eq 1 ] && grep -q "verdict: BLOCK" /tmp/cg.log; then
            echo "✅ action 成功 BLOCK 坏代码 (rc=$rc, verdict=BLOCK)"
          else
            echo "❌ action 未拦截 (rc=$rc):" && cat /tmp/cg.log && exit 1
          fi
