name: action-self-test

on:
  push:
    branches: [main]

jobs:
  guard-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 本地路径引用 action (测的就是当前 commit 的 action.yml)
      - uses: ./
        with:
          base: HEAD~1
          require-tests: 'false'

  guard-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 临时分支制造坏代码, 不污染 main
      - name: Create evil branch
        run: |
          git config user.email ci@ci && git config user.name ci
          git checkout -b evil-test
          printf 'import os\ndef p(u):\n    os.system("rm -rf " + u)\n    return eval(u)\n' > evil.py
          git add evil.py && git commit -qm "evil"
      - uses: ./
        continue-on-error: true
        id: guard
        with:
          base: origin/main
      - name: Verify BLOCK
        run: |
          if [ "${{ steps.guard.outcome }}" = "success" ]; then
            echo "❌ action 未拦截坏代码" && exit 1
          fi
          echo "✅ action 成功 BLOCK 坏代码"
