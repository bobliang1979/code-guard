name: action-self-test

on:
  push:
    branches: [main]

jobs:
  guard-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 本地路径引用 action (测的就是当前 commit 的 action.yml)
      - uses: ./
        with:
          base: HEAD~1
          require-tests: 'false'

  guard-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 临时分支制造坏代码, 不污染 main
      - name: Create evil branch
        run: |
          git config user.email ci@ci && git config user.name ci
          git checkout -b evil-test
          printf 'import os\ndef p(u):\n    os.system("rm -rf " + u)\n    return eval(u)\n' > evil.py
          git add evil.py && git commit -qm "evil"
      # action 拦截坏代码: 期望失败 (verdict=BLOCK)。
      # composite action 内部失败 + continue-on-error 的 outcome 不可靠,
      # 所以用 CLI 等价验证 (action 只是 CLI 的薄封装, 可用性由 guard-clean 证明)
      - name: Verify CLI blocks evil code
        run: |
          pip install --quiet "git+https://github.com/bobliang1979/code-guard.git"
          # bash -e 下命令失败会直接退出, 必须捕获退出码
          set +e
          code-guard check --dir . --base origin/main > /tmp/cg.log 2>&1
          rc=$?
          set -e
          if [ $rc -eq 1 ] && grep -q "verdict: BLOCK" /tmp/cg.log; then
            echo "✅ CLI 拦截坏代码 (rc=$rc, verdict=BLOCK)"
          else
            echo "❌ CLI 未拦截 (rc=$rc):" && cat /tmp/cg.log && exit 1
          fi
