name: 'code-guard'
description: '编码代理安全护栏 — 拦截 LLM 编码代理(Cursor/Claude Code/Codex)提交的危险代码。三扇门: 静态安全/测试回归/假PASS拦截。'
author: 'bobliang1979'

inputs:
  base:
    description: 'git 基线 ref, 对比 base..HEAD (默认: PR base sha)'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  require-tests:
    description: '严格模式: 生产代码改动必须带测试, 否则 BLOCK'
    required: false
    default: 'false'
  timeout:
    description: '测试超时秒数'
    required: false
    default: '120'
  update-baseline:
    description: '把本次测试失败数存为 baseline (首次接入建议 true)'
    required: false
    default: 'false'
  include-tests:
    description: '静态门也扫描测试文件 (默认跳过 — 测试常含故意构造样例)'
    required: false
    default: 'false'
  llm-review:
    description: '启用 LLM 独立评审门 (需 DEEPSEEK_API_KEY/OPENAI_API_KEY secret; API 不可用自动 SKIP)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 'Install code-guard'
      shell: bash
      run: |
        # 用 action 自带源码安装 (零版本漂移): $GITHUB_ACTION_PATH 由 runner 注入,
        # 指向当前引用的 action 目录。企业用 @v0.2.0 装 v0.2.0 代码, 自测用 ./ 装工作区代码。
        pip install --quiet "$GITHUB_ACTION_PATH"
        code-guard --version 2>/dev/null || code-guard demo >/dev/null

    - name: 'Fetch base ref (shallow-clone self-heal)'
      shell: bash
      run: |
        BASE="${{ inputs.base }}"
        if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "base $BASE 不在本地 (浅克隆), 尝试 fetch..."
          git fetch --quiet origin "$BASE" --depth=1 || git fetch --quiet --unshallow
        fi

    - name: 'Run gates'
      shell: bash
      run: |
        EXTRA=""
        if [ "${{ inputs.require-tests }}" = "true" ]; then EXTRA="$EXTRA --require-tests"; fi
        if [ "${{ inputs.update-baseline }}" = "true" ]; then EXTRA="$EXTRA --update-baseline"; fi
        if [ "${{ inputs.include-tests }}" = "true" ]; then EXTRA="$EXTRA --include-tests"; fi
        if [ "${{ inputs.llm-review }}" = "true" ]; then EXTRA="$EXTRA --llm-review"; fi
        # 注意: --base 值直接内联, 不能放进变量再展开 (引号会被当字面字符)
        code-guard check --dir . --base "${{ inputs.base }}" --timeout ${{ inputs.timeout }} $EXTRA

branding:
  icon: 'shield'
  color: 'red'
